<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1210" viewBox="0 0 1600 1210" role="img" aria-labelledby="title desc">
  <title id="title">ModelTrace entity relationship diagram</title>
  <desc id="desc">ER-style diagram for the ModelTrace document database.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6da8ff" />
    </marker>
    <style>
      .bg { fill: #090b0f; }
      .band { fill: #0e141b; stroke: #253244; stroke-width: 1; }
      .entity { fill: #111820; stroke: #35465b; stroke-width: 1.3; rx: 8; }
      .core { fill: #10212b; stroke: #00d4ff; stroke-width: 1.6; rx: 8; }
      .ops { fill: #171821; stroke: #f5b642; stroke-width: 1.2; rx: 8; }
      .gov { fill: #151927; stroke: #9b7bff; stroke-width: 1.2; rx: 8; }
      .title { fill: #eef4f8; font: 700 16px Arial, sans-serif; letter-spacing: 0; }
      .small { fill: #91a1b3; font: 12px Arial, sans-serif; }
      .pk { fill: #00d4ff; font: 12px Arial, sans-serif; }
      .fk { fill: #f5b642; font: 12px Arial, sans-serif; }
      .line { fill: none; stroke: #6da8ff; stroke-width: 1.35; marker-end: url(#arrow); opacity: 0.82; }
      .embed { fill: none; stroke: #00c88c; stroke-width: 1.2; stroke-dasharray: 5 5; marker-end: url(#arrow); opacity: 0.82; }
      .label { fill: #d5f6ff; font: 11px Arial, sans-serif; }
      .section { fill: #6da8ff; font: 800 13px Arial, sans-serif; text-transform: uppercase; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1210" />
  <rect class="band" x="24" y="24" width="1552" height="1162" rx="12" />
  <text class="title" x="54" y="62">ModelTrace - Modelagem documental NoSQL</text>
  <text class="small" x="54" y="86">Relacionamentos logicos entre colecoes; documentos centrais usam subdocumentos para decisao, features, explicacoes e feedback.</text>

  <text class="section" x="80" y="150">Tenant e acesso</text>
  <text class="section" x="80" y="320">Dados e qualidade</text>
  <text class="section" x="520" y="320">Modelo e governanca</text>
  <text class="section" x="900" y="320">Decisoes e auditoria</text>
  <text class="section" x="1260" y="320">Operacao</text>

  <g id="organizations">
    <rect class="core" x="640" y="108" width="280" height="96" />
    <text class="title" x="662" y="138">organizations</text>
    <text class="pk" x="662" y="162">PK _id</text>
    <text class="small" x="662" y="184">name, plan, settings, created_at</text>
  </g>

  <g id="users">
    <rect class="entity" x="80" y="188" width="250" height="122" />
    <text class="title" x="102" y="218">users</text>
    <text class="pk" x="102" y="242">PK _id</text>
    <text class="fk" x="102" y="264">FK org_id</text>
    <text class="small" x="102" y="286">profile, email_verified, avatar_url</text>
  </g>

  <g id="saved_views">
    <rect class="gov" x="80" y="92" width="250" height="80" />
    <text class="title" x="102" y="122">saved_views</text>
    <text class="pk" x="102" y="146">PK _id</text>
    <text class="fk" x="102" y="164">FK org_id, user_id</text>
  </g>

